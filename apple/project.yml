# Generated with XcodeGen: `cd apple && xcodegen generate`.
#
# The .xcodeproj is deliberately not checked in. It is order-sensitive,
# merge-hostile, and cannot be edited safely from a machine with no Xcode —
# which is every machine this project is developed on. This file is the source
# of truth; regenerate rather than edit.
#
# Two targets:
#
#   Oriel           The browser. A window, one WKWebView per tab, a second
#                   WKWebView holding the browser's own interface, and a message
#                   bridge between them. The interface — tab strip, address bar,
#                   toolbar — is HTML from `dist/ios/`, not SwiftUI, because a
#                   skin has to be able to restyle it and because Swift is the
#                   one part of this project nobody in its loop can test.
#   OrielExtension  The Safari Web Extension, kept as a test host and as a
#                   convenience for desktop authoring. Unchanged.
#
# See docs/decisions/001-browser-not-extension.md.

name: Oriel

options:
  bundleIdPrefix: io.github.huukhanh
  deploymentTarget:
    # 16.4 rather than 16.0 for two reasons that both matter: Safari gained
    # Manifest V3 support there, and constructed stylesheets — which are how
    # Oriel gets CSS onto a page whose CSP forbids a <style> element — arrived
    # in the same release. On 16.0 the extension would install and then fail on
    # a large share of the sites worth reskinning.
    iOS: "16.4"
  createIntermediateGroups: true
  # Nothing here is concurrent. Swift 6 strict checking would be a source of
  # build failures on a machine we cannot reproduce, in exchange for safety
  # these targets have no use for.
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Oriel:
    type: application
    platform: iOS
    sources:
      - path: Sources/Browser
      - path: Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.huukhanh.Oriel
        INFOPLIST_FILE: Sources/Browser/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: OrielExtension
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Copy the browser's web payload
        # `dist/ios/` holds the two documents the Swift loads by name: the skin
        # engine, installed into every page as a document-start user script,
        # and the browser's own interface. They are copied into `Web/` inside
        # the app bundle, which is the `subdirectory:` argument in
        # WebViewFactory. Change one and change the other.
        #
        # Copied rather than referenced so `pnpm build` output and the Xcode
        # build stay independent; the only coupling is this path.
        script: |
          set -e
          SOURCE="${SRCROOT}/../dist/ios"
          if [ ! -d "${SOURCE}" ]; then
            echo "error: ${SOURCE} does not exist. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/engine.js" ]; then
            echo "error: ${SOURCE}/engine.js is missing. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/chrome.html" ]; then
            echo "error: ${SOURCE}/chrome.html is missing. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Web"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -R "${SOURCE}"/. "${DEST}"/
          echo "copied the browser's web payload into ${DEST}"
        basedOnDependencyAnalysis: false

  OrielExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
    settings:
      base:
        # Safari requires the extension's bundle identifier to be a child of
        # the container app's. XcodeGen's default would give a sibling, and the
        # failure is an extension that installs but never appears in Safari's
        # settings.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.huukhanh.Oriel.Extension
        INFOPLIST_FILE: Sources/Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Oriel Extension
    postBuildScripts:
      - name: Copy the built web extension
        # The web extension's resources have to sit at the root of the .appex
        # bundle — that is where Safari looks for manifest.json. They are
        # copied rather than referenced so that `pnpm build` output and the
        # Xcode build stay independent; the only coupling is this path.
        script: |
          set -e
          SOURCE="${SRCROOT}/../dist/safari"
          if [ ! -d "${SOURCE}" ]; then
            echo "error: ${SOURCE} does not exist. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/manifest.json" ]; then
            echo "error: ${SOURCE}/manifest.json is missing — the build did not finish."
            exit 1
          fi
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${DEST}"
          cp -R "${SOURCE}"/. "${DEST}"/
          echo "copied web extension resources into ${DEST}"
        basedOnDependencyAnalysis: false

# CI drives xcodebuild by scheme name, so the scheme is declared rather than
# left to XcodeGen's defaults. A scheme that quietly is not generated fails as
# "scheme not found", which reads like a typo in the workflow.
schemes:
  Oriel:
    build:
      targets:
        Oriel: all
    run:
      config: Debug
    archive:
      config: Release
