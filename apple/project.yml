# Generated with XcodeGen: `cd apple && xcodegen generate`.
#
# The .xcodeproj is deliberately not checked in. It is order-sensitive,
# merge-hostile, and cannot be edited safely from a machine with no Xcode —
# which is every machine this project is developed on. This file is the source
# of truth; regenerate rather than edit.
#
# Three targets:
#
#   Oriel           The browser, for iOS. A window, one WKWebView per tab, a second
#                   WKWebView holding the browser's own interface, and a message
#                   bridge between them. The interface — tab strip, address bar,
#                   toolbar — is HTML from `dist/apple/`, not SwiftUI, because a
#                   skin has to be able to restyle it and because Swift is the
#                   one part of this project nobody in its loop can test.
#   OrielMacOS      The same browser, for macOS 13 and later. The *same*
#                   sources — `Sources/Browser` is shared, not forked. About
#                   twenty lines in that directory sit inside
#                   `#if canImport(UIKit)` / `#elseif canImport(AppKit)`; see
#                   Sources/Browser/Platform.swift. Written out as a second
#                   target rather than as XcodeGen's `platform: [iOS, macOS]`
#                   list because explicit YAML is what a machine with no Xcode
#                   can debug, and because it keeps the `Oriel` scheme name
#                   meaning what it has always meant.
#   OrielExtension  The Safari Web Extension, kept as a test host and as a
#                   convenience for desktop authoring. iOS only, and embedded
#                   only in the iOS app — Safari on macOS installs extensions
#                   its own way and that is not what this target is for.
#
# See docs/decisions/001-browser-not-extension.md.

name: Oriel

options:
  bundleIdPrefix: io.github.huukhanh
  deploymentTarget:
    # 16.4 rather than 16.0 for two reasons that both matter: Safari gained
    # Manifest V3 support there, and constructed stylesheets — which are how
    # Oriel gets CSS onto a page whose CSP forbids a <style> element — arrived
    # in the same release. On 16.0 the extension would install and then fail on
    # a large share of the sites worth reskinning.
    iOS: "16.4"
    # Ventura. The oldest release with a WKWebView this shell can rely on and a
    # SwiftUI App lifecycle that behaves, and old enough that raising it later
    # would be a choice rather than a correction. Do not raise it casually: it
    # is written into Info.macOS.plist as LSMinimumSystemVersion.
    macOS: "13.0"
  createIntermediateGroups: true
  # Nothing here is concurrent. Swift 6 strict checking would be a source of
  # build failures on a machine we cannot reproduce, in exchange for safety
  # these targets have no use for.
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # TARGETED_DEVICE_FAMILY is deliberately NOT here. It is an iOS setting —
    # "1,2" means iPhone and iPad — and applying it to the macOS target is a
    # build failure. It is set on each iOS target instead.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Oriel:
    type: application
    platform: iOS
    sources:
      - path: Sources/Browser
        # The two macOS-only files live beside the sources they belong to, and
        # would otherwise be copied into the iOS app as resources — XcodeGen
        # only skips a plist it can see named in INFOPLIST_FILE, and shipping
        # an .entitlements file as a bundle resource is not something to do by
        # accident.
        excludes:
          - Info.macOS.plist
          - Oriel.macOS.entitlements
      - path: Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.huukhanh.Oriel
        INFOPLIST_FILE: Sources/Browser/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: OrielExtension
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Copy the browser's web payload
        # `dist/apple/` holds the two documents the Swift loads by name: the skin
        # engine, installed into every page as a document-start user script,
        # and the browser's own interface. They are copied into `Web/` inside
        # the app bundle, which is the `subdirectory:` argument in
        # WebViewFactory. Change one and change the other.
        #
        # Copied rather than referenced so `pnpm build` output and the Xcode
        # build stay independent; the only coupling is this path.
        script: |
          set -e
          SOURCE="${SRCROOT}/../dist/apple"
          if [ ! -d "${SOURCE}" ]; then
            echo "error: ${SOURCE} does not exist. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/engine.js" ]; then
            echo "error: ${SOURCE}/engine.js is missing. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/chrome.html" ]; then
            echo "error: ${SOURCE}/chrome.html is missing. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Web"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -R "${SOURCE}"/. "${DEST}"/
          echo "copied the browser's web payload into ${DEST}"
        basedOnDependencyAnalysis: false

  OrielMacOS:
    type: application
    platform: macOS
    # The same directory the iOS app compiles. Not a copy, not a symlink, not a
    # second set of files: one source set, with about twenty lines of it inside
    # `#if canImport(UIKit)` / `#elseif canImport(AppKit)`. If this list ever
    # stops matching the iOS target's, that is a bug rather than a design.
    sources:
      - path: Sources/Browser
        excludes:
          # The iOS app's Info.plist. Naming it here keeps it out of the macOS
          # bundle's Resources, where a second Info.plist is at best confusing.
          - Info.plist
    settings:
      base:
        # The same app on a different platform, so the same identifier. Nothing
        # is a child of anything here — OrielExtension is not embedded in this
        # target, so there is no parent/child rule to satisfy.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.huukhanh.Oriel
        PRODUCT_NAME: Oriel
        INFOPLIST_FILE: Sources/Browser/Info.macOS.plist
        GENERATE_INFOPLIST_FILE: NO
        # macOS only. A macOS app is signed with an entitlements file or it is
        # not signed; the sandbox is on, and the network-client entitlement is
        # what lets the web views reach anything at all. The iOS targets get no
        # CODE_SIGN_ENTITLEMENTS, which is why this sits on the target rather
        # than in the shared base.
        CODE_SIGN_ENTITLEMENTS: Sources/Browser/Oriel.macOS.entitlements
        # Deliberately absent: TARGETED_DEVICE_FAMILY (an iOS setting) and
        # ASSETCATALOG_COMPILER_APPICON_NAME. Sources/Assets.xcassets holds one
        # 1024pt icon marked `"platform": "ios"`, so pointing a macOS build at
        # it would ask actool for images that are not in there.
        # TODO(icon): a macOS idiom in AppIcon.appiconset, then add the catalog
        # to this target's sources and set ASSETCATALOG_COMPILER_APPICON_NAME.
    postBuildScripts:
      - name: Copy the browser's web payload
        # Identical to the iOS target's, and identical on purpose. On macOS
        # ${UNLOCALIZED_RESOURCES_FOLDER_PATH} resolves inside Oriel.app/Contents,
        # which is where Bundle.main looks, so the `subdirectory: "Web"` lookup
        # in WebViewFactory is the same lookup on both platforms.
        script: |
          set -e
          SOURCE="${SRCROOT}/../dist/apple"
          if [ ! -d "${SOURCE}" ]; then
            echo "error: ${SOURCE} does not exist. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/engine.js" ]; then
            echo "error: ${SOURCE}/engine.js is missing. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/chrome.html" ]; then
            echo "error: ${SOURCE}/chrome.html is missing. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Web"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -R "${SOURCE}"/. "${DEST}"/
          echo "copied the browser's web payload into ${DEST}"
        basedOnDependencyAnalysis: false

  OrielExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
    settings:
      base:
        # Safari requires the extension's bundle identifier to be a child of
        # the container app's. XcodeGen's default would give a sibling, and the
        # failure is an extension that installs but never appears in Safari's
        # settings.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.huukhanh.Oriel.Extension
        INFOPLIST_FILE: Sources/Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Oriel Extension
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - name: Copy the built web extension
        # The web extension's resources have to sit at the root of the .appex
        # bundle — that is where Safari looks for manifest.json. They are
        # copied rather than referenced so that `pnpm build` output and the
        # Xcode build stay independent; the only coupling is this path.
        script: |
          set -e
          SOURCE="${SRCROOT}/../dist/safari"
          if [ ! -d "${SOURCE}" ]; then
            echo "error: ${SOURCE} does not exist. Run 'pnpm build' at the repo root first."
            exit 1
          fi
          if [ ! -f "${SOURCE}/manifest.json" ]; then
            echo "error: ${SOURCE}/manifest.json is missing — the build did not finish."
            exit 1
          fi
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${DEST}"
          cp -R "${SOURCE}"/. "${DEST}"/
          echo "copied web extension resources into ${DEST}"
        basedOnDependencyAnalysis: false

# CI drives xcodebuild by scheme name, so the scheme is declared rather than
# left to XcodeGen's defaults. A scheme that quietly is not generated fails as
# "scheme not found", which reads like a typo in the workflow.
schemes:
  Oriel:
    build:
      targets:
        Oriel: all
    run:
      config: Debug
    archive:
      config: Release
  # A scheme of its own rather than a second destination on `Oriel`, so CI can
  # ask for it by name and get exactly one platform. `xcodebuild -scheme
  # OrielMacOS` is unambiguous in a way that `-scheme Oriel -destination
  # platform=macOS` is not.
  OrielMacOS:
    build:
      targets:
        OrielMacOS: all
    run:
      config: Debug
    archive:
      config: Release
