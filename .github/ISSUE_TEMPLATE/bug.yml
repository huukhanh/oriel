name: Bug
description: Something behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Which build
      placeholder: v0.3.0, or a commit sha
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version, or Simulator
  - type: textarea
    id: log
    attributes:
      label: Log contents, if a script is involved
      description: Log button → Copy. It captures document-start activity that Safari Web Inspector misses if you attach late.
      render: text
