name: Install problem
description: It will not install, or will not launch
labels: ["bug"]
body:
  - type: dropdown
    id: how
    attributes:
      label: How you installed it
      options:
        - SideStore
        - AltStore
        - Sideloadly
        - scripts/install-device.sh
        - scripts/run-simulator.sh
        - Xcode from source
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The error, verbatim
      description: Paraphrasing loses the part that identifies the cause.
      render: text
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
