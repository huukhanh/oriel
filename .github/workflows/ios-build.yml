# The real compiler.
#
# This project is developed on a headless Linux box with no Xcode, and every
# Apple API in App/ has until now been *asserted* — typechecked against stub
# frameworks that encode what we believe the SDK looks like. A macOS runner has
# the actual SDK, so this is the job that turns "compiles-unknown" into a fact.
#
# Builds for the simulator with signing off: the question here is whether the
# code compiles and links against the real frameworks, not whether it can be
# installed on a device.
name: ios-build

on:
  pull_request:
  push:
    branches: [main]

# Every push to a PR branch used to start a second, identical run - one for
# `push` and one for `pull_request`. On the macOS runner that is 10x-billed
# minutes spent proving the same thing twice. Superseded runs are also
# cancelled: only the newest commit's result is worth paying for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: App
        run: xcodegen generate

      # Runner images change their installed simulators without notice, and a
      # hardcoded device name turns that into a red build that looks like a code
      # regression. Pick whatever iPhone this image actually has.
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .name')
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "no iPhone simulator available on this image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $name"
          echo "device=$name" >> "$GITHUB_OUTPUT"

      # Whatever the build says about our API assumptions is the point of this
      # job, so surface it clearly rather than burying it in noise.
      - name: Build (iOS Simulator)
        working-directory: App
        run: |
          set +e
          xcodebuild \
            -project Oriel.xcodeproj \
            -scheme Oriel \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          # The diagnostics are the product of this job. Piping xcodebuild
          # through `tail` buries them under the copy-resource chatter that
          # comes after the failure.
          echo "───────── errors ─────────"
          grep -E "error:" build.log | sort -u | head -60
          echo "───────── warnings ───────"
          grep -E "warning:" build.log | grep -v "Sources/Shims" | sort -u | head -30
          echo "──────────────────────────"
          exit $status

      # Compiling settles the signatures. It does NOT settle content worlds or
      # the message-handler bridge, which fail silently — the script runs and
      # messageHandlers is just undefined. Only a running WKWebView shows that.
      - name: Test (iOS Simulator)
        working-directory: App
        run: |
          set +e
          xcodebuild \
            -project Oriel.xcodeproj \
            -scheme Oriel \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test > test.log 2>&1
          status=$?
          echo "───────── failures ─────────"
          grep -E "error:|failed|XCTAssert" test.log | sort -u | head -60
          echo "───────── summary ──────────"
          grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test" test.log | tail -10
          echo "────────────────────────────"
          exit $status

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            App/build.log
            App/test.log
          if-no-files-found: ignore

  # Runs the script a Mac user is told to run, on a Mac. A helper script that
  # has never been executed is documentation, not tooling — and its failure
  # modes (missing simulator, unbootable runtime, app that installs but does
  # not launch) are exactly what a person hits on their first try.
  mac-scripts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: scripts/run-simulator.sh --build
        run: ./scripts/run-simulator.sh --build

      - name: Confirm the app is actually installed and running
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices booted -j \
            | jq -r '[.devices[][]] | .[0].udid')
          test -n "$DEVICE" -a "$DEVICE" != "null" || { echo "FAIL: nothing booted"; exit 1; }

          # `simctl launch` succeeding only means the launch request was
          # accepted. A crash on startup still leaves no running process, which
          # is the failure this catches.
          for _ in $(seq 1 10); do
            PID=$(xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null \
              | grep -i "com.oriel.browser" | awk '{print $1}' | head -1) || true
            [ -n "${PID:-}" ] && [ "$PID" != "-" ] && break
            sleep 2
          done
          test -n "${PID:-}" -a "${PID:-}" != "-" \
            || { echo "FAIL: Oriel is installed but not running — it crashed on launch"; exit 1; }
          echo "Oriel is running (pid $PID)"

      - name: Reject the device script on a machine with no device
        run: |
          # It must fail with the message a person can act on, not a stack
          # trace or a silent success.
          if ./scripts/install-device.sh > out.txt 2>&1; then
            echo "FAIL: it claimed success with no device attached"; cat out.txt; exit 1
          fi
          grep -q "no paired iPhone found" out.txt \
            || { echo "FAIL: unhelpful failure message:"; cat out.txt; exit 1; }
          echo "fails as intended:"; head -3 out.txt
