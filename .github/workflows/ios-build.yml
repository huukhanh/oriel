# The real compiler.
#
# This project is developed on a headless Linux box with no Xcode, and every
# Apple API in App/ has until now been *asserted* — typechecked against stub
# frameworks that encode what we believe the SDK looks like. A macOS runner has
# the actual SDK, so this is the job that turns "compiles-unknown" into a fact.
#
# Builds for the simulator with signing off: the question here is whether the
# code compiles and links against the real frameworks, not whether it can be
# installed on a device.
name: ios-build

on:
  pull_request:
  push:
    branches: [main]

# Every push to a PR branch used to start a second, identical run - one for
# `push` and one for `pull_request`. On the macOS runner that is 10x-billed
# minutes spent proving the same thing twice. Superseded runs are also
# cancelled: only the newest commit's result is worth paying for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: App
        run: xcodegen generate

      # Runner images change their installed simulators without notice, and a
      # hardcoded device name turns that into a red build that looks like a code
      # regression. Pick whatever iPhone this image actually has.
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .name')
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "no iPhone simulator available on this image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $name"
          echo "device=$name" >> "$GITHUB_OUTPUT"

      # Whatever the build says about our API assumptions is the point of this
      # job, so surface it clearly rather than burying it in noise.
      - name: Build (iOS Simulator)
        working-directory: App
        run: |
          set +e
          xcodebuild \
            -project Oriel.xcodeproj \
            -scheme Oriel \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          # The diagnostics are the product of this job. Piping xcodebuild
          # through `tail` buries them under the copy-resource chatter that
          # comes after the failure.
          echo "───────── errors ─────────"
          grep -E "error:" build.log | sort -u | head -60
          echo "───────── warnings ───────"
          grep -E "warning:" build.log | grep -v "Sources/Shims" | sort -u | head -30
          echo "──────────────────────────"
          exit $status

      # Compiling settles the signatures. It does NOT settle content worlds or
      # the message-handler bridge, which fail silently — the script runs and
      # messageHandlers is just undefined. Only a running WKWebView shows that.
      - name: Test (iOS Simulator)
        working-directory: App
        run: |
          set +e
          xcodebuild \
            -project Oriel.xcodeproj \
            -scheme Oriel \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test > test.log 2>&1
          status=$?
          echo "───────── failures ─────────"
          grep -E "error:|failed|XCTAssert" test.log | sort -u | head -60
          echo "───────── summary ──────────"
          grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test" test.log | tail -10
          echo "────────────────────────────"
          exit $status

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            App/build.log
            App/test.log
          if-no-files-found: ignore

  # Runs the script a Mac user is told to run, on a Mac. A helper script that
  # has never been executed is documentation, not tooling — and its failure
  # modes (missing simulator, unbootable runtime, app that installs but does
  # not launch) are exactly what a person hits on their first try.
  mac-scripts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: scripts/run-simulator.sh --build
        run: ./scripts/run-simulator.sh --build

      - name: Confirm the app is actually installed and running
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices booted -j \
            | jq -r '[.devices[][]] | .[0].udid')
          test -n "$DEVICE" -a "$DEVICE" != "null" || { echo "FAIL: nothing booted"; exit 1; }

          # `simctl launch` succeeding only means the launch request was
          # accepted. A crash on startup still leaves no running process, which
          # is the failure this catches.
          for _ in $(seq 1 10); do
            PID=$(xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null \
              | grep -i "com.oriel.browser" | awk '{print $1}' | head -1) || true
            [ -n "${PID:-}" ] && [ "$PID" != "-" ] && break
            sleep 2
          done
          test -n "${PID:-}" -a "${PID:-}" != "-" \
            || { echo "FAIL: Oriel is installed but not running — it crashed on launch"; exit 1; }
          echo "Oriel is running (pid $PID)"

      # The device script's failure paths are what people actually hit, and a
      # runner with no phone attached is the right place to exercise them: a
      # script that dies with a stack trace is worse than one that does not run.
      - name: install-device.sh — preconditions and flags
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1"; cat out.txt 2>/dev/null; exit 1; }

          # --help must work and exit 0, or nobody can discover the flags.
          ./scripts/install-device.sh --help > out.txt 2>&1 || fail "--help exited non-zero"
          grep -q -- "--device" out.txt || fail "--help does not list the flags"

          # --list must succeed even with nothing paired. It is the first thing
          # the guide tells people to run, so it cannot be an error path.
          set +e
          ./scripts/install-device.sh --list > out.txt 2>&1
          LIST_STATUS=$?
          set -e
          echo "--- --list output (exit $LIST_STATUS) ---"; cat out.txt
          [ "$LIST_STATUS" = 0 ] || fail "--list exited $LIST_STATUS"

          # macOS ships bash 3.2, and the scripts must work there — that is
          # what people actually have. A `cmd | head -1` under `set -o
          # pipefail` aborts with 134 when head closes the pipe first, which is
          # how this was found.
          for s in scripts/*.sh; do
            bash --posix -n "$s" 2>/dev/null || bash -n "$s" || fail "$s is not valid shell"
          done
          grep -qi "no paired devices\|UDID\|devicectl could not" out.txt \
            || fail "--list printed nothing useful"

          # No device: must fail, and must say what to do about it.
          if ./scripts/install-device.sh > out.txt 2>&1; then
            fail "claimed success with no device attached"
          fi
          grep -q "no paired iPhone or iPad found" out.txt || fail "unhelpful message"
          grep -q "Developer Mode" out.txt || fail "does not mention the usual cause"
          grep -q "DEVICE-SETUP" out.txt || fail "does not point at the guide"

          # An unknown flag must be rejected, not silently ignored — silently
          # ignoring one means a typo'd --device installs to the wrong phone.
          if ./scripts/install-device.sh --nope > out.txt 2>&1; then
            fail "accepted an unknown flag"
          fi
          grep -q "unknown option" out.txt || fail "unclear message for a bad flag"

          # A flag needing a value must not swallow the next argument.
          if ./scripts/install-device.sh --device > out.txt 2>&1; then
            fail "accepted --device with no value"
          fi

          echo "all precondition paths behave"

      - name: The guide is linked and its promises exist
        run: |
          set -euo pipefail
          test -f docs/DEVICE-SETUP.md || { echo "FAIL: guide missing"; exit 1; }
          grep -q "DEVICE-SETUP.md" README.md \
            || { echo "FAIL: the guide is not linked from the README"; exit 1; }
          # Every flag the guide documents must actually be accepted, or the
          # guide is lying to someone who cannot easily tell.
          for flag in --list --clean --build-only --logs --release --ipa --team; do
            grep -q -- "$flag" scripts/install-device.sh \
              || { echo "FAIL: guide documents $flag but the script has no such flag"; exit 1; }
          done
          # The guide must not tell people to set the Team in Xcode's editor:
          # the script regenerates the project on every run and wipes it, so
          # that advice is a loop with no exit. It was, once.
          if grep -n "Signing & Capabilities → Team" docs/DEVICE-SETUP.md \
              | grep -qv "does not stick"; then
            grep -q "does not stick, and cannot" docs/DEVICE-SETUP.md \
              || { echo "FAIL: the guide recommends an editor setting that gets wiped"; exit 1; }
          fi
          echo "guide and script agree"
