# Linux-only checks. This does NOT build the iOS app — there is no macOS
# runner here. A green check means Core and web logic pass; it says nothing
# about whether App/ compiles.
name: linux-checks
on:
  pull_request:
  push:
    branches: [main]

# Every push to a PR branch used to start a second, identical run - one for
# `push` and one for `pull_request`. On the macOS runner that is 10x-billed
# minutes spent proving the same thing twice. Superseded runs are also
# cancelled: only the newest commit's result is worth paying for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path Core
      - run: swift test --package-path Core
      # Typechecks the real app sources against stub SwiftUI/UIKit/WebKit/
      # AVFoundation modules, in Swift 6 language mode. NOT a substitute for
      # building in Xcode — a stub encodes what we believe an Apple API looks
      # like — but it catches every error that has nothing to do with Apple.
      - run: swift build --package-path App
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web

  # The injection engine in a real browser engine. Playwright's WebKit is the
  # WPE/GTK port — same JavaScriptCore and WebCore as WKWebView on iOS. It says
  # nothing about content worlds or media, but it settles injection timing, CSP
  # and history interception, which jsdom cannot model at all.
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Runners have root, so the whole local-prefix dance in
      # scripts/setup-webkit-linux.sh collapses to this one line.
      - run: pnpm exec playwright install --with-deps webkit
        working-directory: web
      - run: pnpm test:webkit
        working-directory: web
