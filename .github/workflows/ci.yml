# What a green check here does and does not mean.
#
# DOES: the pure logic is tested; the extension builds for all three targets;
# the built extension loads into a real Chromium, its service worker boots, its
# content script skins a real page, and the injection engine behaves correctly
# in a real WebKit engine.
#
# ALSO DOES: typecheck the iOS browser shell's Swift against stub frameworks, so
# an invented method or a wrong signature fails here rather than on a Mac an
# hour later. It does not compile against the real SDK; see the job's comment.
#
# DOES NOT: say anything about Safari on iOS, or about how any of this behaves
# on a phone. No CI runner can load a Safari Web Extension onto a device, and no
# Linux runner has an iOS SDK. That gap is the subject of docs/VERIFICATION.md
# and is closed by a human with a device, not by this file.
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: package.json's "packageManager" field is the one
      # source of truth, and giving the action a second one is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The authoring CLI has no dependencies on purpose; prove it still runs
      # on a bare Node, and that it validates the skins this repo ships. The
      # trailing slash keeps the glob to directories — `skins/*` would also
      # hand it the gallery index and the README.
      - run: node tools/oriel/bin/oriel.js check skins/*/

  build:
    name: build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: package.json's "packageManager" field is the one
      # source of truth, and giving the action a second one is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A manifest that does not parse is an extension that cannot be installed,
      # and the error the browser shows is not always the reason.
      - name: manifests are valid JSON
        run: for f in dist/*/manifest.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/
          retention-days: 14

  swift-typecheck:
    name: swift typecheck
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # Compiles apple/Sources/Browser — the real browser shell, unmodified —
      # against hand-written stubs of SwiftUI, UIKit, WebKit and Combine in
      # apple/Harness/Sources. There is no iOS SDK on a Linux runner, so this
      # proves the Swift is internally consistent and agrees with the API
      # surface the stubs describe. It does NOT prove that surface is Apple's;
      # only .github/workflows/apple.yml, on a macOS runner, does that.
      #
      # Worth having anyway: it catches invented methods, wrong labels, wrong
      # optionality and every type error, which is most of what goes wrong when
      # writing Swift without a compiler. See apple/Harness/README.md.
      - run: swift build --package-path apple

  e2e:
    name: real browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: package.json's "packageManager" field is the one
      # source of truth, and giving the action a second one is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Runners have root, so the local-prefix staging in
      # scripts/setup-browsers-linux.sh collapses to this.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            test-results/
            dist/
          retention-days: 7
